name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CMake is pinned: `import std` sits behind an experimental gate whose value depends on the
  # CMake series, and SpecLab refuses a series it has not qualified.
  CMAKE_VERSION: "4.3.6"
  CMAKE_SHA256: fba967b44c7b40f155f9492dacb5477aab8333699986e1e07a7d90803aba7219

jobs:
  attribution:
    name: Attribution rule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Authors, committers and co-authors must be contactable human accounts, and nothing may
      # attribute the work to an AI tool (CONTRIBUTING.md, "Authorship and attribution").
      - name: Check commits and pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A first push has no "before" commit: check the pushed commit alone.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${HEAD_SHA}~1"
          fi
          python3 tools/check_attribution.py "${BASE_SHA}..${HEAD_SHA}"

  linux-gcc:
    name: Linux, GCC 16.1
    runs-on: ubuntu-latest
    # Pinned to 16.1.0, like SpecLab and MduX: GCC 16.2.0 corrupts module BMIs (SpecLab issue 17).
    container: gcc:16.1.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ninja-build ccache python3 wget git

      - name: Install pinned CMake
        run: |
          set -eu
          archive="${RUNNER_TEMP}/cmake.tar.gz"
          wget -q -O "$archive" "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          echo "${CMAKE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /opt
          ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake" /usr/local/bin/cmake
          ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest" /usr/local/bin/ctest

      - name: Show tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          ccache --version | head -1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Builds this repository with no launcher, with ccache and with cppmcache, and publishes the
      # table. The numbers come from a shared runner: read the hit counts, not small differences.
      - name: Compare ccache and cppmcache
        run: |
          python3 tools/compare_caches.py \
            --source . --work "${RUNNER_TEMP}/bench" \
            --cppmcache build/cppmcache \
            --edit src/cppmcache/Hash.cppm \
            --label "cppmcache built with GCC 16.1 ($(ccache --version | head -1))" \
            --cmake-arg=-DCMAKE_CXX_COMPILER=g++ \
            --output-json comparison-gcc.json --output-markdown comparison-gcc.md
          cat comparison-gcc.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-comparison-gcc
          path: comparison-gcc.*
          if-no-files-found: ignore

  linux-clang:
    name: Linux, Clang 21 with libc++
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: "21"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang, libc++ and tools
        run: |
          set -euo pipefail
          # The key is checked against its fingerprint before it is trusted.
          LLVM_KEY_FPR="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.asc
          gpg --show-keys --with-colons --fingerprint /tmp/llvm-snapshot.asc \
            | awk -F: '/^fpr:/ {print $10}' | grep -qx "$LLVM_KEY_FPR"
          gpg --dearmor < /tmp/llvm-snapshot.asc > /tmp/llvm.gpg
          sudo install -m 0644 /tmp/llvm.gpg /etc/apt/keyrings/llvm.gpg
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache \
            "clang-${LLVM_VERSION}" "clang-format-${LLVM_VERSION}" "libc++-${LLVM_VERSION}-dev" "libc++abi-${LLVM_VERSION}-dev"

      - name: Install pinned CMake
        run: |
          set -eu
          archive="${RUNNER_TEMP}/cmake.tar.gz"
          wget -q -O "$archive" "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          echo "${CMAKE_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The toolchain file addresses /usr/lib/llvm-<N>/bin directly, so that is what is shown here,
      # not whatever `clang++` on the PATH happens to be.
      - name: Show tool versions
        run: |
          "/usr/lib/llvm-${LLVM_VERSION}/bin/clang++" --version
          cmake --version
          ninja --version
          ccache --version | head -1

      - name: Check formatting
        run: |
          git ls-files 'src/*.cppm' 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' \
            | xargs "clang-format-${LLVM_VERSION}" --dry-run -Werror

      - name: Configure
        env:
          CPPMCACHE_LLVM_ROOT: /usr/lib/llvm-21
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release --toolchain cmake/toolchains/linux-clang-libcxx.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          CPPMCACHE_LLVM_ROOT: /usr/lib/llvm-21
        run: ctest --test-dir build --output-on-failure

      # The same remote cache test, against a real server instead of the test one. The image is
      # pinned by digest.
      - name: Test the remote cache against bazel-remote
        env:
          BAZEL_REMOTE_IMAGE: buchgr/bazel-remote-cache@sha256:c6e9c3ef67c20bfa558559f314cf4213ec8f890488e5722d42ee26cc743f576f
        run: |
          set -euo pipefail
          docker run -d --rm --name bazel-remote -p 127.0.0.1:19090:8080 "$BAZEL_REMOTE_IMAGE" --max_size=1 --dir=/data
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:19090/status > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:19090/status > /dev/null
          CPPMCACHE_TEST_REMOTE=http://127.0.0.1:19090 ctest --test-dir build -R 'integration\.remote\.plain' --output-on-failure
          docker logs bazel-remote 2>&1 | grep -cE ' (GET|PUT|HEAD) ' | xargs echo "requests served by bazel-remote:"
          docker rm -f bazel-remote

      - name: Compare ccache and cppmcache
        env:
          CPPMCACHE_LLVM_ROOT: /usr/lib/llvm-21
        run: |
          python3 tools/compare_caches.py \
            --source . --work "${RUNNER_TEMP}/bench" \
            --cppmcache build/cppmcache \
            --edit src/cppmcache/Hash.cppm \
            --label "cppmcache built with Clang ${LLVM_VERSION} and libc++ ($(ccache --version | head -1))" \
            "--cmake-arg=--toolchain=${GITHUB_WORKSPACE}/cmake/toolchains/linux-clang-libcxx.cmake" \
            --output-json comparison-clang.json --output-markdown comparison-clang.md
          cat comparison-clang.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-comparison-clang
          path: comparison-clang.*
          if-no-files-found: ignore

  windows-msvc:
    name: Windows, MSVC
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Install Ninja and ccache
        run: choco install ninja ccache --no-progress -y

      # Puts cl.exe and its environment (INCLUDE, LIB, PATH) in place for the following steps.
      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Show tool versions
        shell: bash
        run: |
          cl 2>&1 | head -1
          cmake --version
          ninja --version
          ccache --version | head -1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Compare ccache and cppmcache
        shell: bash
        run: |
          python tools/compare_caches.py \
            --source . --work "${RUNNER_TEMP}/bench" \
            --cppmcache build/cppmcache.exe \
            --edit src/cppmcache/Hash.cppm \
            --label "cppmcache built with MSVC ($(ccache --version | head -1))" \
            --cmake-arg=-DCMAKE_CXX_COMPILER=cl \
            --output-json comparison-msvc.json --output-markdown comparison-msvc.md
          cat comparison-msvc.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-comparison-msvc
          path: comparison-msvc.*
          if-no-files-found: ignore
